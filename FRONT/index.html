<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Lumina Chat</title>

<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet"/>

<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/lucide@latest"></script>

<script>
  tailwind.config = {
    theme: {
      extend: {
        fontFamily: {
          sans: ['Inter', 'sans-serif'],
          serif: ['Instrument Serif', 'serif'],
        },
      },
    },
  };
</script>

<style>
  ::-webkit-scrollbar { width: 6px; height: 6px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.08); border-radius: 9999px; }
  ::-webkit-scrollbar-thumb:hover { background: rgba(249,115,22,0.35); }

  html, body { height: 100%; }
  body { background: #050505; }

  /* ---------- Shared border-gradient mask helper (from design system) ---------- */
  [style*="--border-gradient"] { position: relative; }
  [style*="--border-gradient"]::before {
    content: "";
    position: absolute;
    inset: 0;
    padding: 1px;
    border-radius: var(--border-radius-before, inherit);
    -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
    -webkit-mask-composite: xor;
    mask-composite: exclude;
    background: var(--border-gradient);
    pointer-events: none;
  }

  /* ---------- Falling beams (subtle, decorative) ---------- */
  @keyframes beam-fall {
    0% { transform: translateY(-100%); opacity: 0; }
    5% { opacity: .5; }
    50% { opacity: 1; }
    95% { opacity: .5; }
    100% { transform: translateY(120vh); opacity: 0; }
  }
  .animate-beam-1 { animation: beam-fall 9s linear infinite; animation-delay: 0s; }
  .animate-beam-2 { animation: beam-fall 12s linear infinite; animation-delay: 3s; }
  .animate-beam-3 { animation: beam-fall 10s linear infinite; animation-delay: 6s; }

  /* ---------- Scroll / message reveal ---------- */
  @keyframes fadeSlideIn {
    0% { opacity: 0; transform: translateY(16px); filter: blur(6px); }
    100% { opacity: 1; transform: translateY(0); filter: blur(0); }
  }
  .msg-in { animation: fadeSlideIn .5s cubic-bezier(0.2,0.8,0.2,1) both; }

  @keyframes popIn {
    0% { opacity: 0; transform: scale(.92) translateY(6px); }
    100% { opacity: 1; transform: scale(1) translateY(0); }
  }
  .pop-in { animation: popIn .35s cubic-bezier(0.2,0.8,0.2,1) both; }

  /* ---------- Typing indicator ---------- */
  @keyframes typingBounce {
    0%, 60%, 100% { transform: translateY(0); opacity: .4; }
    30% { transform: translateY(-4px); opacity: 1; }
  }
  .typing-dot { animation: typingBounce 1.1s ease-in-out infinite; }
  .typing-dot:nth-child(2) { animation-delay: .15s; }
  .typing-dot:nth-child(3) { animation-delay: .3s; }

  /* ---------- Send button (adapted from .button-custom) ---------- */
  .btn-send {
    cursor: pointer;
    position: relative;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    transition: all .25s ease;
    background: radial-gradient(65.28% 65.28% at 50% 100%, rgba(251,191,36,0.85) 0%, rgba(251,191,36,0) 100%), linear-gradient(0deg, #ea580c, #ea580c);
    border-radius: 9999px;
    border: none;
    flex-shrink: 0;
  }
  .btn-send::before {
    content: "";
    position: absolute;
    inset: 1px;
    background: linear-gradient(177.95deg, rgba(255,255,255,0.3) 0%, rgba(255,255,255,0) 100%);
    border-radius: 9999px;
    z-index: 0;
  }
  .btn-send:disabled { opacity: .4; cursor: not-allowed; filter: grayscale(.4); }
  .btn-send:not(:disabled):hover { transform: scale(1.06); box-shadow: 0 0 30px rgba(249,115,22,0.45); }
  .btn-send:not(:disabled):active { transform: scale(0.94); }
  .btn-send .inner { position: relative; z-index: 2; color: white; display: inline-flex; align-items: center; justify-content: center; }

  .points_wrapper { overflow: hidden; width: 100%; height: 100%; pointer-events: none; position: absolute; inset: 0; z-index: 1; border-radius: 9999px; }
  .points_wrapper .point { bottom: -10px; position: absolute; animation: floating-points infinite ease-in-out; pointer-events: none; width: 2px; height: 2px; background-color: #fff; border-radius: 9999px; }
  @keyframes floating-points { 0% { transform: translateY(0); } 85% { opacity: 0; } 100% { transform: translateY(-30px); opacity: 0; } }
  .points_wrapper .point:nth-child(1) { left: 20%; opacity: 1; animation-duration: 1.6s; animation-delay: .1s; }
  .points_wrapper .point:nth-child(2) { left: 45%; opacity: .7; animation-duration: 1.9s; animation-delay: .4s; }
  .points_wrapper .point:nth-child(3) { left: 65%; opacity: .8; animation-duration: 1.4s; animation-delay: .2s; }
  .points_wrapper .point:nth-child(4) { left: 80%; opacity: .6; animation-duration: 1.7s; }

  /* ---------- Glass surfaces ---------- */
  .glass { background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); }
  .glass-strong { background: rgba(20,20,20,0.7); border: 1px solid rgba(255,255,255,0.08); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); }

  /* ---------- Message content formatting ---------- */
  .msg-content p { margin: 0 0 .65em 0; }
  .msg-content p:last-child { margin-bottom: 0; }
  .msg-content strong { color: #fff; font-weight: 600; }
  .msg-content code { background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.08); padding: 1px 6px; border-radius: 5px; font-size: .85em; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
  .msg-content pre { background: #0a0a0a; border: 1px solid rgba(255,255,255,0.08); border-radius: 10px; padding: 12px 14px; overflow-x: auto; margin: .65em 0; }
  .msg-content pre code { background: none; border: none; padding: 0; }

  textarea.chat-input { field-sizing: content; }
  textarea.chat-input::placeholder { color: rgba(255,255,255,0.35); }

  .conv-item.active { background: rgba(255,255,255,0.07); border-color: rgba(255,255,255,0.12); }

  .sidebar-transition { transition: width .3s cubic-bezier(0.2,0.8,0.2,1), margin .3s cubic-bezier(0.2,0.8,0.2,1), opacity .2s ease; }

  @media (max-width: 768px) {
    #sidebar.open { transform: translateX(0) !important; }
  }
</style>
</head>
<body class="bg-[#050505] text-white font-sans antialiased overflow-hidden selection:bg-orange-500/30 h-screen flex">

<!-- ================= Decorative background ================= -->
<div class="fixed inset-0 -z-10 pointer-events-none overflow-hidden">
  <div class="absolute inset-0 bg-[#050505]"></div>
  <div class="absolute top-[-10%] left-[10%] w-[45vw] h-[45vw] bg-orange-600/10 rounded-full blur-[140px]"></div>
  <div class="absolute bottom-[-15%] right-[5%] w-[40vw] h-[40vw] bg-amber-500/10 rounded-full blur-[140px]"></div>
  <div class="absolute inset-0 bg-[radial-gradient(ellipse_at_top,_var(--tw-gradient-stops))] from-orange-900/5 via-transparent to-transparent"></div>
  <div class="absolute inset-0 opacity-[0.4] flex w-full">
    <div class="flex-1 border-r border-white/[0.03] h-full relative overflow-hidden">
      <div class="absolute top-0 -left-px w-px h-64 bg-gradient-to-b from-transparent via-orange-500/50 to-transparent animate-beam-1"></div>
    </div>
    <div class="flex-1 border-r border-white/[0.03] h-full relative overflow-hidden hidden md:block"></div>
    <div class="flex-1 border-r border-white/[0.03] h-full relative overflow-hidden hidden lg:block">
      <div class="absolute top-0 -left-px w-px h-48 bg-gradient-to-b from-transparent via-orange-500/40 to-transparent animate-beam-2"></div>
    </div>
    <div class="flex-1 border-r border-white/[0.03] h-full relative overflow-hidden hidden lg:block"></div>
    <div class="flex-1 h-full relative overflow-hidden hidden md:block">
      <div class="absolute top-0 -left-px w-px h-56 bg-gradient-to-b from-transparent via-orange-500/40 to-transparent animate-beam-3"></div>
    </div>
  </div>
</div>

<!-- ================= Sidebar ================= -->
<aside id="sidebar" class="sidebar-transition w-72 shrink-0 flex flex-col border-r border-white/5 bg-black/40 backdrop-blur-xl h-screen z-20 fixed md:relative -translate-x-full md:translate-x-0">
  <div class="flex items-center gap-3 px-5 py-6">
    <div class="flex bg-gradient-to-tr from-orange-500 to-amber-500 w-8 h-8 rounded-full items-center justify-center shadow-[0_0_20px_rgba(249,115,22,0.35)]" style="position:relative; --border-gradient: linear-gradient(180deg, rgba(255,255,255,0.5), rgba(255,255,255,0)); --border-radius-before: 9999px;">
      <div class="w-2.5 h-2.5 bg-black rounded-full"></div>
    </div>
    <span class="text-lg font-semibold tracking-tight text-white">Lumina</span>
  </div>

  <div class="px-4">
    <button id="newChatBtn" class="w-full flex items-center gap-2 justify-center text-sm font-medium text-white/90 hover:text-white glass hover:bg-white/[0.08] rounded-xl px-4 py-3 transition-colors duration-300">
      <i data-lucide="plus" class="w-4 h-4 text-orange-400"></i>
      Nova conversa
    </button>
  </div>

  <div class="mt-6 px-4 flex-1 overflow-y-auto flex flex-col gap-1 pb-4">
    <span class="text-[10px] font-bold tracking-widest uppercase text-neutral-600 px-2 mb-1">Conversas</span>
    <div id="convList" class="flex flex-col gap-1"></div>
  </div>

  <div class="px-5 py-4 border-t border-white/5 flex items-center gap-2 text-[11px] text-neutral-600">
    <span class="w-1.5 h-1.5 rounded-full bg-green-400 shadow-[0_0_8px_rgba(74,222,128,0.6)]" id="statusDot"></span>
    <span id="statusText">Verificando API…</span>
  </div>
</aside>

<div id="sidebarOverlay" class="fixed inset-0 bg-black/60 z-10 hidden md:hidden"></div>

<!-- ================= Main chat area ================= -->
<main class="flex-1 flex flex-col h-screen relative min-w-0">

  <!-- header -->
  <header class="flex items-center justify-between px-5 md:px-8 py-4 border-b border-white/5 glass-strong z-10">
    <div class="flex items-center gap-3 min-w-0">
      <button id="menuBtn" class="md:hidden text-neutral-400 hover:text-white transition-colors">
        <i data-lucide="menu" class="w-5 h-5"></i>
      </button>
      <div class="flex flex-col min-w-0">
        <span id="chatTitle" class="text-sm font-semibold tracking-tight text-white truncate">Nova conversa</span>
        <span class="text-[11px] text-neutral-500 font-mono truncate">via OpenRouter</span>
      </div>
    </div>
    <button id="clearBtn" title="Excluir conversa" class="text-neutral-500 hover:text-orange-400 transition-colors">
      <i data-lucide="trash-2" class="w-4 h-4"></i>
    </button>
  </header>

  <!-- messages -->
  <div id="messages" class="flex-1 overflow-y-auto px-4 md:px-0">
    <div class="max-w-3xl mx-auto flex flex-col gap-6 py-10" id="messagesInner"></div>
  </div>

  <!-- empty state -->
  <div id="emptyState" class="absolute inset-0 flex items-center justify-center pointer-events-none px-6">
    <div class="text-center max-w-md">
      <div class="mx-auto mb-6 flex bg-gradient-to-tr from-orange-500 to-amber-500 w-14 h-14 rounded-full items-center justify-center shadow-[0_0_40px_rgba(249,115,22,0.3)]">
        <div class="w-5 h-5 bg-black rounded-full"></div>
      </div>
      <h1 class="text-3xl font-medium tracking-tighter text-white mb-2">Como posso ajudar?</h1>
      <p class="text-sm text-neutral-500">Comece digitando uma mensagem abaixo. Suas conversas ficam salvas neste navegador.</p>
    </div>
  </div>

  <!-- input -->
  <div class="px-4 md:px-8 pb-6 pt-2 z-10">
    <div class="max-w-3xl mx-auto">
      <div id="inputWrap" class="glass rounded-3xl flex items-end gap-2 p-2 pl-5 shadow-2xl transition-colors duration-300 focus-within:border-orange-500/30" style="position:relative; --border-gradient: linear-gradient(180deg, rgba(255,255,255,0.12), rgba(255,255,255,0)); --border-radius-before: 24px;">
        <textarea
          id="chatInput"
          class="chat-input flex-1 bg-transparent resize-none outline-none text-sm text-white placeholder:text-white/30 py-3 max-h-48 leading-relaxed"
          rows="1"
          placeholder="Envie uma mensagem para a Lumina…"
        ></textarea>
        <button id="sendBtn" class="btn-send w-10 h-10 mb-1.5">
          <div class="points_wrapper" id="pointsWrapper">
            <i class="point"></i><i class="point"></i><i class="point"></i><i class="point"></i>
          </div>
          <span class="inner">
            <i data-lucide="arrow-up" class="w-4 h-4"></i>
          </span>
        </button>
      </div>
      <p class="text-center text-[11px] text-neutral-600 mt-3">Lumina pode cometer erros. Verifique informações importantes.</p>
    </div>
  </div>
</main>

<script>
  lucide.createIcons({ attrs: { 'stroke-width': 1.75 } });

  // ------------------------------------------------------------------
  // The backend (/send_message) is stateless: it forwards a single
  // "message" string straight to the LLM with no memory of prior turns.
  // To keep the conversation coherent across turns we fold the visible
  // history into that single string before sending it.
  // ------------------------------------------------------------------
  const API_BASE = 'http://127.0.0.1:8000';
  const STORAGE_KEY = 'lumina_chat_conversations';
  const HISTORY_TURNS = 12;

  const el = {
    convList: document.getElementById('convList'),
    messages: document.getElementById('messages'),
    messagesInner: document.getElementById('messagesInner'),
    emptyState: document.getElementById('emptyState'),
    chatInput: document.getElementById('chatInput'),
    sendBtn: document.getElementById('sendBtn'),
    chatTitle: document.getElementById('chatTitle'),
    newChatBtn: document.getElementById('newChatBtn'),
    clearBtn: document.getElementById('clearBtn'),
    statusDot: document.getElementById('statusDot'),
    statusText: document.getElementById('statusText'),
    menuBtn: document.getElementById('menuBtn'),
    sidebar: document.getElementById('sidebar'),
    sidebarOverlay: document.getElementById('sidebarOverlay'),
  };

  let state = loadState();
  if (!state.conversations.length) {
    state = { conversations: [createConversation()], activeId: null };
    state.activeId = state.conversations[0].id;
  }
  if (!state.activeId || !state.conversations.find(c => c.id === state.activeId)) {
    state.activeId = state.conversations[0].id;
  }

  function createConversation() {
    return { id: crypto.randomUUID(), title: 'Nova conversa', messages: [] };
  }

  function loadState() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (!raw) return { conversations: [], activeId: null };
      const parsed = JSON.parse(raw);
      if (!Array.isArray(parsed.conversations)) return { conversations: [], activeId: null };
      return parsed;
    } catch {
      return { conversations: [], activeId: null };
    }
  }

  function saveState() {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
  }

  function getActive() {
    return state.conversations.find(c => c.id === state.activeId);
  }

  function escapeHtml(str) {
    return str
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;');
  }

  function formatContent(raw) {
    const escaped = escapeHtml(raw);
    const withCode = escaped.replace(/```([\s\S]*?)```/g, (_, code) => `<pre><code>${code.trim()}</code></pre>`);
    const withInline = withCode.replace(/`([^`]+)`/g, '<code>$1</code>');
    const withBold = withInline.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
    const paragraphs = withBold.split(/\n{2,}/).map(p => `<p>${p.replace(/\n/g, '<br>')}</p>`).join('');
    return paragraphs;
  }

  function renderSidebar() {
    el.convList.innerHTML = '';
    [...state.conversations].reverse().forEach(conv => {
      const item = document.createElement('div');
      item.className = 'conv-item group flex items-center gap-2 rounded-xl px-3 py-2.5 border border-transparent cursor-pointer hover:bg-white/5 transition-colors duration-200' + (conv.id === state.activeId ? ' active' : '');
      item.innerHTML = `
        <i data-lucide="message-square" class="w-3.5 h-3.5 text-neutral-500 shrink-0"></i>
        <span class="text-sm text-neutral-300 truncate flex-1">${escapeHtml(conv.title)}</span>
        <button data-del="${conv.id}" class="opacity-0 group-hover:opacity-100 text-neutral-600 hover:text-orange-400 transition-opacity">
          <i data-lucide="x" class="w-3.5 h-3.5"></i>
        </button>
      `;
      item.addEventListener('click', (e) => {
        if (e.target.closest('[data-del]')) return;
        state.activeId = conv.id;
        saveState();
        renderAll();
        closeSidebarMobile();
      });
      item.querySelector('[data-del]').addEventListener('click', (e) => {
        e.stopPropagation();
        deleteConversation(conv.id);
      });
      el.convList.appendChild(item);
    });
    lucide.createIcons({ attrs: { 'stroke-width': 1.75 } });
  }

  function deleteConversation(id) {
    state.conversations = state.conversations.filter(c => c.id !== id);
    if (!state.conversations.length) {
      state.conversations.push(createConversation());
    }
    if (state.activeId === id) {
      state.activeId = state.conversations[state.conversations.length - 1].id;
    }
    saveState();
    renderAll();
  }

  function bubble(role, content, opts = {}) {
    const isUser = role === 'user';
    const wrap = document.createElement('div');
    wrap.className = `flex ${isUser ? 'justify-end' : 'justify-start'} msg-in`;

    const inner = document.createElement('div');
    if (isUser) {
      inner.className = 'max-w-[80%] md:max-w-[70%] bg-gradient-to-br from-orange-500 to-amber-600 text-white rounded-2xl rounded-br-md px-4 py-3 shadow-lg shadow-orange-500/10';
      inner.innerHTML = `<div class="msg-content text-sm leading-relaxed">${formatContent(content)}</div>`;
    } else {
      inner.className = 'max-w-[85%] md:max-w-[75%] glass rounded-2xl rounded-bl-md px-4 py-3';
      if (opts.typing) {
        inner.innerHTML = `<div class="flex items-center gap-1.5 h-4 px-1">
          <span class="typing-dot w-1.5 h-1.5 rounded-full bg-orange-400"></span>
          <span class="typing-dot w-1.5 h-1.5 rounded-full bg-orange-400"></span>
          <span class="typing-dot w-1.5 h-1.5 rounded-full bg-orange-400"></span>
        </div>`;
      } else if (opts.error) {
        inner.className += ' border-red-500/20 bg-red-500/5';
        inner.innerHTML = `<div class="flex items-start gap-2 text-sm text-red-300">
          <i data-lucide="alert-triangle" class="w-4 h-4 mt-0.5 shrink-0"></i>
          <span>${escapeHtml(content)}</span>
        </div>`;
      } else {
        inner.innerHTML = `<div class="msg-content text-sm leading-relaxed text-neutral-100">${formatContent(content)}</div>`;
      }
    }
    wrap.appendChild(inner);
    return wrap;
  }

  function renderMessages() {
    const conv = getActive();
    el.messagesInner.innerHTML = '';
    el.chatTitle.textContent = conv.title;
    el.emptyState.style.display = conv.messages.length ? 'none' : 'flex';
    conv.messages.forEach(m => el.messagesInner.appendChild(bubble(m.role, m.content)));
    scrollToBottom();
    lucide.createIcons({ attrs: { 'stroke-width': 1.75 } });
  }

  function renderAll() {
    renderSidebar();
    renderMessages();
  }

  function scrollToBottom() {
    requestAnimationFrame(() => {
      el.messages.scrollTop = el.messages.scrollHeight;
    });
  }

  function buildPrompt(conv, newMessage) {
    const recent = conv.messages.slice(-HISTORY_TURNS);
    if (!recent.length) return newMessage;
    const transcript = recent
      .map(m => `${m.role === 'user' ? 'Usuário' : 'Assistente'}: ${m.content}`)
      .join('\n\n');
    return `${transcript}\n\nUsuário: ${newMessage}\n\nAssistente:`;
  }

  function autoResize() {
    el.chatInput.style.height = 'auto';
    el.chatInput.style.height = Math.min(el.chatInput.scrollHeight, 192) + 'px';
  }

  async function sendMessage() {
    const text = el.chatInput.value.trim();
    if (!text || el.sendBtn.disabled) return;

    const conv = getActive();
    conv.messages.push({ role: 'user', content: text });
    if (conv.messages.length === 1) {
      conv.title = text.slice(0, 40) + (text.length > 40 ? '…' : '');
    }
    saveState();
    renderAll();

    el.chatInput.value = '';
    autoResize();
    setLoading(true);

    const typingBubble = bubble('assistant', '', { typing: true });
    el.messagesInner.appendChild(typingBubble);
    scrollToBottom();

    const prompt = buildPrompt({ messages: conv.messages.slice(0, -1) }, text);

    try {
      const res = await fetch(`${API_BASE}/send_message`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ message: prompt }),
      });
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      const data = await res.json();
      typingBubble.remove();
      conv.messages.push({ role: 'assistant', content: data.response });
      saveState();
      renderMessages();
    } catch (err) {
      typingBubble.remove();
      el.messagesInner.appendChild(
        bubble('assistant', 'Não foi possível falar com a API em ' + API_BASE + '. Verifique se o servidor está rodando (uv run start).', { error: true })
      );
      scrollToBottom();
      lucide.createIcons({ attrs: { 'stroke-width': 1.75 } });
    } finally {
      setLoading(false);
    }
  }

  function setLoading(isLoading) {
    el.sendBtn.disabled = isLoading || !el.chatInput.value.trim();
    el.chatInput.disabled = isLoading;
  }

  function closeSidebarMobile() {
    el.sidebar.classList.add('-translate-x-full');
    el.sidebar.classList.remove('open');
    el.sidebarOverlay.classList.add('hidden');
  }

  el.chatInput.addEventListener('input', () => {
    autoResize();
    el.sendBtn.disabled = !el.chatInput.value.trim();
  });

  el.chatInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      sendMessage();
    }
  });

  el.sendBtn.addEventListener('click', sendMessage);

  el.newChatBtn.addEventListener('click', () => {
    const conv = createConversation();
    state.conversations.push(conv);
    state.activeId = conv.id;
    saveState();
    renderAll();
    closeSidebarMobile();
    el.chatInput.focus();
  });

  el.clearBtn.addEventListener('click', () => {
    deleteConversation(state.activeId);
  });

  el.menuBtn.addEventListener('click', () => {
    el.sidebar.classList.remove('-translate-x-full');
    el.sidebar.classList.add('open');
    el.sidebarOverlay.classList.remove('hidden');
  });

  el.sidebarOverlay.addEventListener('click', closeSidebarMobile);

  async function checkApiStatus() {
    try {
      const res = await fetch(`${API_BASE}/docs`, { method: 'GET' });
      if (res.ok || res.status === 404) {
        el.statusDot.className = 'w-1.5 h-1.5 rounded-full bg-green-400 shadow-[0_0_8px_rgba(74,222,128,0.6)]';
        el.statusText.textContent = 'API conectada';
      } else {
        throw new Error();
      }
    } catch {
      el.statusDot.className = 'w-1.5 h-1.5 rounded-full bg-red-500 shadow-[0_0_8px_rgba(239,68,68,0.6)]';
      el.statusText.textContent = 'API offline';
    }
  }

  el.sendBtn.disabled = true;
  renderAll();
  checkApiStatus();
  setInterval(checkApiStatus, 15000);
</script>
</body>
</html>
